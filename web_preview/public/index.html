<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge – Food Bank Inventory & Donation Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --primary: #237A57;
      --primary-dark: #165239;
      --primary-light: #389B72;
      --secondary: #E8F5EC;
      --bg-page: #EDF2EE;
      --bg-app: #F8FAF8;
      --surface: #FFFFFF;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --danger: #C62828;
      --danger-bg: #FFEBEE;
      --warning: #E65100;
      --warning-bg: #FFF3E0;
      --success: #2E7D32;
      --success-bg: #E8F5E9;
      --purple: #7C3AED;
      --purple-bg: #F3E8FF;
      --amber: #D97706;
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --bg-page: #0C120F;
      --bg-app: #121815;
      --surface: #18221D;
      --card-bg: #1E2822;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #2E3D35;
      --secondary: #1F382B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    /* Page background: soft, neutral backdrop that centers the mobile-sized app */
    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s, color 0.2s;
    }

    /* PURE PHONE-SIZED APP CANVAS (No notch, no phone bezels, no device hardware!) */
    .app-canvas {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    @media (max-width: 480px) {
      .app-canvas {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    /* TOP APP BAR */
    .app-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }
    .app-title h2 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text-main);
    }
    .app-title span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .app-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.15s;
    }
    .icon-btn:hover {
      background: var(--secondary);
    }
    .icon-btn .alert-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--danger);
      color: white;
      font-size: 9px;
      font-weight: 800;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SCROLLABLE SCREEN CONTENT */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 88px 16px;
      scroll-behavior: smooth;
    }

    /* BOTTOM NAVIGATION BAR */
    .bottom-bar {
      background: var(--surface);
      border-top: 1px solid var(--border-color);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
    }
    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 10px;
      transition: all 0.15s;
    }
    .tab-btn .material-symbols-rounded {
      font-size: 22px;
      font-variation-settings: 'FILL' 0;
    }
    .tab-btn span {
      font-size: 11px;
      font-weight: 600;
    }
    .tab-btn.active {
      color: var(--primary);
    }
    .tab-btn.active .material-symbols-rounded {
      font-variation-settings: 'FILL' 1;
    }

    /* CARDS */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    /* HERO BANNER */
    .hero-banner {
      background: linear-gradient(135deg, #1B5E43 0%, #237A57 100%);
      color: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 18px rgba(35, 122, 87, 0.2);
    }
    .hero-banner .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
      color: #E8F5EC;
      margin-bottom: 8px;
    }
    .hero-banner h3 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .hero-banner p {
      font-size: 12px;
      color: #D1E7DD;
      line-height: 1.4;
    }

    /* KPI GRID (2 columns, phone-sized) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 88px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .kpi-card:hover {
      border-color: var(--primary);
    }
    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-header span {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .kpi-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kpi-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
    }
    .kpi-sub {
      font-size: 10.5px;
      font-weight: 600;
      margin-top: 2px;
    }

    /* QUICK ACTIONS */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .action-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .action-btn:hover { background: var(--secondary); }
    .action-btn .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .action-btn span {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* BADGES & CHIPS */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-info { background: #E1F5FE; color: #0277BD; }
    .badge-purple { background: var(--purple-bg); color: var(--purple); }

    /* SEARCH & FILTER */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: var(--text-main);
    }
    .chips-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .chips-scroll::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip.active {
      background: var(--secondary);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 800;
    }

    /* FAB */
    .fab {
      position: absolute;
      bottom: 78px;
      right: 18px;
      background: var(--primary);
      color: white;
      padding: 12px 18px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(35, 122, 87, 0.4);
      cursor: pointer;
      border: none;
      font-size: 13px;
      font-weight: 700;
      z-index: 25;
    }

    /* BOTTOM MODAL SHEET */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      align-items: flex-end;
    }
    .modal-sheet {
      width: 100%;
      max-height: 85%;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      animation: sheetUp 0.2s ease-out;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    /* SNACKBAR */
    .snackbar {
      position: absolute;
      bottom: 74px;
      left: 14px;
      right: 14px;
      background: #1E2923;
      color: white;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 150;
    }
  </style>
</head>
<body>

  <!-- PURE PHONE-SIZED APP CANVAS (No notch, no fake phone hardware bezels!) -->
  <div class="app-canvas">

    <!-- Top App Bar -->
    <div class="app-bar">
      <div class="app-title">
        <h2 id="pageTitle">FoodBridge</h2>
        <span id="pageSub">Food Bank Operations Hub</span>
      </div>
      <div class="app-actions">
        <button class="icon-btn" onclick="openExpiryCenter()" title="Expiry Alerts">
          <span class="material-symbols-rounded">notifications_active</span>
          <div class="alert-badge" id="alertCount">2</div>
        </button>
        <button class="icon-btn" onclick="openHistoryScreen()" title="Transaction History">
          <span class="material-symbols-rounded">receipt_long</span>
        </button>
        <button class="icon-btn" onclick="openSettingsScreen()" title="Settings">
          <span class="material-symbols-rounded">settings</span>
        </button>
      </div>
    </div>

    <!-- Scrollable Screen Content -->
    <div class="screen-content" id="screenView">
      <!-- Screen content rendered dynamically -->
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="mainFab" onclick="onFabClicked()">
      <span class="material-symbols-rounded">add</span>
      <span id="fabText">New Donation</span>
    </button>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-bar">
      <button class="tab-btn active" onclick="switchScreen('dashboard')">
        <span class="material-symbols-rounded">dashboard</span>
        <span>Home</span>
      </button>
      <button class="tab-btn" onclick="switchScreen('donations')">
        <span class="material-symbols-rounded">favorite</span>
        <span>Donations</span>
      </button>
      <button class="tab-btn" onclick="switchScreen('inventory')">
        <span class="material-symbols-rounded">inventory_2</span>
        <span>Inventory</span>
      </button>
      <button class="tab-btn" onclick="switchScreen('distribution')">
        <span class="material-symbols-rounded">local_shipping</span>
        <span>Distribution</span>
      </button>
      <button class="tab-btn" onclick="switchScreen('reports')">
        <span class="material-symbols-rounded">analytics</span>
        <span>Reports</span>
      </button>
    </div>

    <!-- Modal Sheet -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
      <div class="modal-sheet" id="modalSheet"></div>
    </div>

    <!-- Toast Notification -->
    <div class="snackbar" id="snackbar">
      <span id="snackMsg">Action completed.</span>
      <span class="material-symbols-rounded" style="cursor: pointer;" onclick="hideSnackbar()">close</span>
    </div>

  </div>

  <script>
    // State data matching SQLite database
    let inventory = [
      { id: 'inv-1', foodName: 'Rice', category: 'Rice and Grains', availableQuantity: 150.0, unit: 'kg', expiryDate: '2026-11-20', status: 'Sufficient' },
      { id: 'inv-2', foodName: 'Wheat Flour', category: 'Rice and Grains', availableQuantity: 80.0, unit: 'kg', expiryDate: '2026-10-15', status: 'Sufficient' },
      { id: 'inv-3', foodName: 'Toor Dal', category: 'Pulses', availableQuantity: 45.0, unit: 'kg', expiryDate: '2026-12-05', status: 'Sufficient' },
      { id: 'inv-4', foodName: 'Sunflower Cooking Oil', category: 'Packaged Food', availableQuantity: 30.0, unit: 'litres', expiryDate: '2026-10-30', status: 'Sufficient' },
      { id: 'inv-5', foodName: 'Glucose Biscuits', category: 'Packaged Food', availableQuantity: 120.0, unit: 'packets', expiryDate: '2026-09-30', status: 'Expiring Soon' },
      { id: 'inv-6', foodName: 'Fresh Vegetables Basket', category: 'Vegetables', availableQuantity: 35.0, unit: 'kg', expiryDate: '2026-09-15', status: 'Expiring Soon' },
      { id: 'inv-7', foodName: 'Pasteurized Milk Packets', category: 'Dairy Products', availableQuantity: 15.0, unit: 'litres', expiryDate: '2026-09-12', status: 'Low Stock' },
      { id: 'inv-8', foodName: 'Fresh Apples & Oranges', category: 'Fruits', availableQuantity: 18.0, unit: 'kg', expiryDate: '2026-09-16', status: 'Low Stock' },
      { id: 'inv-9', foodName: 'Artisan Bread Loaves', category: 'Packaged Food', availableQuantity: 10.0, unit: 'packets', expiryDate: '2026-09-02', status: 'Expired' }
    ];

    let donations = [
      { id: 'don-1', donorName: 'Green Future NGO', phone: '+91 98765 43210', foodItem: 'Rice', category: 'Rice and Grains', quantity: 175, unit: 'kg', date: '2026-09-01', condition: 'Fresh' },
      { id: 'don-2', donorName: 'Local Supermarket', phone: '+91 91234 56789', foodItem: 'Glucose Biscuits', category: 'Packaged Food', quantity: 140, unit: 'packets', date: '2026-09-03', condition: 'Good' },
      { id: 'don-3', donorName: 'Community Volunteers', phone: '+91 99887 76655', foodItem: 'Fresh Vegetables Basket', category: 'Vegetables', quantity: 45, unit: 'kg', date: '2026-09-06', condition: 'Fresh' },
      { id: 'don-4', donorName: 'Priya Sharma (Individual)', phone: '+91 90123 45678', foodItem: 'Sunflower Cooking Oil', category: 'Packaged Food', quantity: 30, unit: 'litres', date: '2026-09-07', condition: 'Fresh' },
      { id: 'don-5', donorName: 'City Dairy Co-op', phone: '+91 94567 89012', foodItem: 'Pasteurized Milk Packets', category: 'Dairy Products', quantity: 25, unit: 'litres', date: '2026-09-08', condition: 'Fresh' }
    ];

    let distributions = [
      { id: 'dist-1', recipient: 'Community Welfare Center', phone: '+91 98451 11223', foodItem: 'Rice', quantity: 25, unit: 'kg', date: '2026-09-04', purpose: 'Community kitchen lunch program' },
      { id: 'dist-2', recipient: 'Sneha Nilayam Orphanage', phone: '+91 94401 22334', foodItem: 'Glucose Biscuits', quantity: 20, unit: 'packets', date: '2026-09-05', purpose: 'Evening snacks for resident children' },
      { id: 'dist-3', recipient: 'Govt Primary School', phone: '+91 93901 33445', foodItem: 'Fresh Vegetables Basket', quantity: 10, unit: 'kg', date: '2026-09-07', purpose: 'Nutritious lunch supplements' },
      { id: 'dist-4', recipient: 'Needy Families Support', phone: '+91 91001 44556', foodItem: 'Pasteurized Milk Packets', quantity: 10, unit: 'litres', date: '2026-09-08', purpose: 'Dietary relief for toddlers & elderly' }
    ];

    let currentScreen = 'dashboard';
    let isDarkMode = false;
    let selectedCategory = 'All';
    let searchQuery = '';

    function showToast(msg, isSuccess = true) {
      const sb = document.getElementById('snackbar');
      document.getElementById('snackMsg').innerText = msg;
      sb.style.background = isSuccess ? '#237A57' : '#C62828';
      sb.style.display = 'flex';
      setTimeout(() => { sb.style.display = 'none'; }, 3200);
    }
    function hideSnackbar() { document.getElementById('snackbar').style.display = 'none'; }

    function switchScreen(screenKey) {
      currentScreen = screenKey;
      selectedCategory = 'All';
      searchQuery = '';

      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        const keys = ['dashboard', 'donations', 'inventory', 'distribution', 'reports'];
        btn.classList.toggle('active', keys[idx] === screenKey);
      });

      const fab = document.getElementById('mainFab');
      const fabText = document.getElementById('fabText');
      if (screenKey === 'donations') {
        fab.style.display = 'flex';
        fab.style.background = '#237A57';
        fabText.innerText = 'New Donation';
      } else if (screenKey === 'inventory') {
        fab.style.display = 'flex';
        fab.style.background = '#0284C7';
        fabText.innerText = 'Add Food Item';
      } else if (screenKey === 'distribution') {
        fab.style.display = 'flex';
        fab.style.background = '#7C3AED';
        fabText.innerText = 'Distribute Food';
      } else {
        fab.style.display = 'none';
      }

      renderScreen();
    }

    function renderScreen() {
      const view = document.getElementById('screenView');
      const title = document.getElementById('pageTitle');
      const sub = document.getElementById('pageSub');

      const expiredCount = inventory.filter(i => i.status === 'Expired').length;
      const expiringSoon = inventory.filter(i => i.status === 'Expiring Soon').length;
      document.getElementById('alertCount').innerText = expiredCount + expiringSoon;

      if (currentScreen === 'dashboard') {
        title.innerText = 'FoodBridge';
        sub.innerText = 'Food Bank Operations Hub';
        renderDashboard(view);
      } else if (currentScreen === 'donations') {
        title.innerText = 'Donation Management';
        sub.innerText = 'Food Inflow & Donor Registry';
        renderDonations(view);
      } else if (currentScreen === 'inventory') {
        title.innerText = 'Inventory Stock';
        sub.innerText = 'Warehouse Storage & Shelf Tracking';
        renderInventory(view);
      } else if (currentScreen === 'distribution') {
        title.innerText = 'Food Distribution';
        sub.innerText = 'Relief Outflow & Beneficiaries';
        renderDistribution(view);
      } else if (currentScreen === 'reports') {
        title.innerText = 'Reports & Analytics';
        sub.innerText = 'Zero Hunger (SDG 2) Impact Data';
        renderReports(view);
      }
    }

    /* ----------------- SCREEN 1: DASHBOARD ----------------- */
    function renderDashboard(container) {
      const totalStock = inventory.reduce((a, b) => a + b.availableQuantity, 0);
      const totalDonationsQty = donations.reduce((a, b) => a + b.quantity, 0);
      const totalDistQty = distributions.reduce((a, b) => a + b.quantity, 0);
      const expiringSoonCount = inventory.filter(i => i.status === 'Expiring Soon').length;
      const lowStockCount = inventory.filter(i => i.status === 'Low Stock' || i.availableQuantity <= 20).length;

      container.innerHTML = `
        <div class="hero-banner">
          <div class="hero-pill">
            <span class="material-symbols-rounded" style="font-size: 14px; color: #F59E0B;">bolt</span>
            Active Operations Hub
          </div>
          <h3>Empowering Zero Hunger (SDG 2)</h3>
          <p>Rescue surplus food, prevent warehouse spoilage, and distribute relief packages seamlessly.</p>
        </div>

        <div style="font-size: 13.5px; font-weight: 800; margin-bottom: 10px;">Operational Metrics</div>
        <div class="kpi-grid">
          <div class="kpi-card" onclick="switchScreen('inventory')">
            <div class="kpi-header">
              <span>Total Items</span>

    /* ----------------- MODALS & CRUD FORMS ----------------- */
    function onFabClicked() {
      if (currentScreen === 'donations') openAddDonationModal();
      else if (currentScreen === 'inventory') openAddInventoryModal();
      else if (currentScreen === 'distribution') openAddDistributionModal();
    }

    function openModal(contentHtml) {
      const sheet = document.getElementById('modalSheet');
      sheet.innerHTML = `<div class="sheet-handle"></div>` + contentHtml;
      document.getElementById('modalOverlay').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function closeModalOnOverlay(e) { if (e.target.id === 'modalOverlay') closeModal(); }

    function openAddDonationModal() {
      openModal(`
        <h3 style="font-size:17px; font-weight:800; margin-bottom:14px;">Record Food Donation</h3>
        <div class="form-group">
          <label>Donor Name *</label>
          <input class="form-control" id="donName" placeholder="e.g. Green Harvest Trust" />
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input class="form-control" id="donPhone" placeholder="e.g. +91 98765 43210" />
        </div>
        <div class="form-group">
          <label>Food Item Name *</label>
          <input class="form-control" id="donItem" placeholder="e.g. Basmati Rice" />
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>Quantity *</label>
            <input class="form-control" id="donQty" type="number" placeholder="50" />
          </div>
          <div class="form-group" style="flex:1;">
            <label>Unit *</label>
            <select class="form-control" id="donUnit"><option>kg</option><option>litres</option><option>packets</option><option>pieces</option></select>
          </div>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select class="form-control" id="donCat">
            <option>Rice and Grains</option><option>Vegetables</option><option>Fruits</option><option>Dairy Products</option><option>Packaged Food</option><option>Pulses</option>
          </select>
        </div>
        <div class="form-group">
          <label>Condition</label>
          <select class="form-control" id="donCond"><option>Fresh</option><option>Good</option><option>Needs Attention</option></select>
        </div>
        <button class="btn-submit" onclick="saveDonation()">Save Donation & Update Inventory</button>
      `);
    }

    function saveDonation() {
      const name = document.getElementById('donName').value.trim();
      const phone = document.getElementById('donPhone').value.trim();
      const item = document.getElementById('donItem').value.trim();
      const qty = parseFloat(document.getElementById('donQty').value);
      const unit = document.getElementById('donUnit').value;
      const cat = document.getElementById('donCat').value;
      const cond = document.getElementById('donCond').value;

      if (!name || !item || isNaN(qty) || qty <= 0) {
        showToast('Please fill all required donation fields properly.', false);
        return;
      }

      donations.unshift({
        id: 'don-' + Date.now(),
        donorName: name,
        phone: phone || '+91 99999 00000',
        foodItem: item,
        category: cat,
        quantity: qty,
        unit: unit,
        date: new Date().toISOString().split('T')[0],
        condition: cond
      });

      const existing = inventory.find(i => i.foodName.toLowerCase() === item.toLowerCase() && i.unit === unit);
      if (existing) {
        existing.availableQuantity += qty;
      } else {
        inventory.push({
          id: 'inv-' + Date.now(),
          foodName: item,
          category: cat,
          availableQuantity: qty,
          unit: unit,
          expiryDate: '2026-12-31',
          status: 'Sufficient'
        });
      }

      closeModal();
      showToast(`Donation saved! +${qty} ${unit} added to warehouse inventory.`);
      renderScreen();
    }

    function openAddDistributionModal() {
      const eligible = inventory.filter(i => i.status !== 'Expired' && i.availableQuantity > 0);
      openModal(`
        <h3 style="font-size:17px; font-weight:800; color:#7C3AED; margin-bottom:14px;">Distribute Relief Food</h3>
        <div class="form-group">
          <label>Recipient / Organization Name *</label>
          <input class="form-control" id="distRec" placeholder="e.g. Sneha Welfare Center" />
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input class="form-control" id="distPhone" placeholder="e.g. +91 94401 22334" />
        </div>
        <div class="form-group">
          <label>Select Food Item from Stock *</label>
          <select class="form-control" id="distItemSelect" onchange="updateDistItemStockBanner()">
            ${eligible.map(item => `
              <option value="${item.id}">${item.foodName} (${item.availableQuantity} ${item.unit} available)</option>
            `).join('')}
          </select>
        </div>
        <div id="distStockBanner" style="background:var(--secondary); padding:8px 12px; border-radius:8px; font-size:12px; font-weight:700; color:var(--primary); margin-bottom:12px;"></div>
        <div class="form-group">
          <label>Quantity to Distribute *</label>
          <input class="form-control" id="distQty" type="number" placeholder="Enter amount to deduct" />
        </div>
        <div class="form-group">
          <label>Purpose / Relief Program *</label>
          <input class="form-control" id="distPurpose" placeholder="e.g. Mid-day meals for 50 kids" />
        </div>
        <button class="btn-submit" style="background:#7C3AED;" onclick="saveDistribution()">Confirm Distribution & Deduct Stock</button>
      `);
      updateDistItemStockBanner();
    }

    function updateDistItemStockBanner() {
      const select = document.getElementById('distItemSelect');
      if (!select) return;
      const item = inventory.find(i => i.id === select.value);
      const banner = document.getElementById('distStockBanner');
      if (item) {
        banner.innerText = `Available to dispatch: ${item.availableQuantity} ${item.unit}`;
      }
    }

    function saveDistribution() {
      const rec = document.getElementById('distRec').value.trim();
      const phone = document.getElementById('distPhone').value.trim();
      const itemId = document.getElementById('distItemSelect').value;
      const qty = parseFloat(document.getElementById('distQty').value);
      const purpose = document.getElementById('distPurpose').value.trim();
      const item = inventory.find(i => i.id === itemId);

      if (!rec || !item || isNaN(qty) || qty <= 0) {
        showToast('Please enter valid distribution details.', false);
        return;
      }

      if (qty > item.availableQuantity) {
        showToast(`Stock Insufficient! Available: ${item.availableQuantity} ${item.unit}`, false);
        return;
      }

      item.availableQuantity -= qty;
      distributions.unshift({
        id: 'dist-' + Date.now(),
        recipient: rec,
        phone: phone || '+91 94401 00000',
        foodItem: item.foodName,
        quantity: qty,
        unit: item.unit,
        date: new Date().toISOString().split('T')[0],
        purpose: purpose || 'Relief dispatch'
      });

      closeModal();
      showToast(`Distribution confirmed! -${qty} ${item.unit} deducted from inventory.`);
      renderScreen();
    }

    function openAddInventoryModal() {
      openModal(`
        <h3 style="font-size:17px; font-weight:800; color:#0284C7; margin-bottom:14px;">Add Food Item to Inventory</h3>
        <div class="form-group">
          <label>Food Name *</label>
          <input class="form-control" id="invName" placeholder="e.g. Toor Dal" />
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select class="form-control" id="invCat">
            <option>Rice and Grains</option><option>Vegetables</option><option>Fruits</option><option>Dairy Products</option><option>Packaged Food</option><option>Pulses</option>
          </select>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>Available Quantity *</label>
            <input class="form-control" id="invQty" type="number" placeholder="40" />
          </div>
          <div class="form-group" style="flex:1;">
            <label>Unit *</label>
            <select class="form-control" id="invUnit"><option>kg</option><option>litres</option><option>packets</option><option>pieces</option></select>
          </div>
        </div>
        <div class="form-group">
          <label>Expiry Date *</label>
          <input class="form-control" id="invExp" type="date" value="2026-11-30" />
        </div>
        <button class="btn-submit" style="background:#0284C7;" onclick="saveInventoryItem()">Add to Warehouse</button>
      `);
    }

    function saveInventoryItem() {
      const name = document.getElementById('invName').value.trim();
      const cat = document.getElementById('invCat').value;
      const qty = parseFloat(document.getElementById('invQty').value);
      const unit = document.getElementById('invUnit').value;
      const exp = document.getElementById('invExp').value;

      if (!name || isNaN(qty) || qty < 0) {
        showToast('Please enter valid item details.', false);
        return;
      }

      inventory.unshift({
        id: 'inv-' + Date.now(),
        foodName: name,
        category: cat,
        availableQuantity: qty,
        unit: unit,
        expiryDate: exp,
        status: qty <= 20 ? 'Low Stock' : 'Sufficient'
      });

      closeModal();
      showToast(`"${name}" added to inventory.`);
      renderScreen();
    }

    /* ----------------- SUB-SCREENS: EXPIRY, HISTORY, SETTINGS ----------------- */
    function openExpiryCenter() {
      const expired = inventory.filter(i => i.status === 'Expired');
      const expiringSoon = inventory.filter(i => i.status === 'Expiring Soon');
      openModal(`
        <h3 style="font-size:17px; font-weight:800; color:#C62828; margin-bottom:12px;">Expiry Management Center</h3>
        <div style="background:#FFEBEE; border:1px solid rgba(198,40,40,0.3); border-radius:12px; padding:10px; font-size:11.5px; font-weight:700; color:#C62828; margin-bottom:14px;">
          CRITICAL POLICY: Expired food is strictly prohibited from distribution.
        </div>
        <div style="font-size:13px; font-weight:800; margin-bottom:6px;">Expired Items (${expired.length})</div>
        ${expired.length ? expired.map(item => `
          <div class="card" style="padding:10px; border-color:rgba(198,40,40,0.4);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700; font-size:14px;">${item.foodName}</div>
                <div style="font-size:11px; color:#C62828;">Expired on ${item.expiryDate}</div>
              </div>
              <button style="background:#C62828; color:white; border:none; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;" onclick="disposeExpiredStock('${item.id}')">Dispose Stock</button>
            </div>
          </div>
        `).join('') : '<div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">No expired food in inventory.</div>'}

        <div style="font-size:13px; font-weight:800; margin:14px 0 6px 0;">Expiring Within 7 Days (${expiringSoon.length})</div>
        ${expiringSoon.map(item => `
          <div class="card" style="padding:10px; border-color:rgba(230,81,0,0.4);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700; font-size:14px;">${item.foodName}</div>
                <div style="font-size:11px; color:#E65100;">Exp: ${item.expiryDate} (High Priority)</div>
              </div>
              <span class="badge badge-warning">${item.availableQuantity} ${item.unit}</span>
            </div>
          </div>
        `).join('')}
      `);
    }

    function disposeExpiredStock(id) {
      inventory = inventory.filter(i => i.id !== id);
      closeModal();
      showToast('Expired stock disposed safely.');
      renderScreen();
    }

    function openHistoryScreen() {
      openModal(`
        <h3 style="font-size:17px; font-weight:800; margin-bottom:14px;">Unified Transaction Audit</h3>
        <div style="max-height: 400px; overflow-y: auto;">
          ${donations.map(d => `
            <div class="card" style="padding:10px; margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between;">
                <span class="badge badge-success">Donation (In)</span>
                <span style="font-size:10px; font-family:monospace; color:var(--text-muted);">${d.id}</span>
              </div>
              <div style="display:flex; justify-content:space-between; margin-top:6px; font-weight:700; font-size:13px;">
                <span>${d.foodItem}</span>
                <span style="color:var(--primary);">+${d.quantity} ${d.unit}</span>
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">From: ${d.donorName} • ${d.date}</div>
            </div>
          `).join('')}
          ${distributions.map(dist => `
            <div class="card" style="padding:10px; margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between;">
                <span class="badge badge-purple">Distribution (Out)</span>
                <span style="font-size:10px; font-family:monospace; color:var(--text-muted);">${dist.id}</span>
              </div>
              <div style="display:flex; justify-content:space-between; margin-top:6px; font-weight:700; font-size:13px;">
                <span>${dist.foodItem}</span>
                <span style="color:#7C3AED;">-${dist.quantity} ${dist.unit}</span>
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">To: ${dist.recipient} • ${dist.date}</div>
            </div>
          `).join('')}
        </div>
      `);
    }

    function openSettingsScreen() {
      openModal(`
        <h3 style="font-size:17px; font-weight:800; margin-bottom:14px;">Settings & Information</h3>
        <div class="card" style="padding:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:700; font-size:13px;">Dark Theme</div>
            <div style="font-size:11px; color:var(--text-muted);">Toggle night mode palette</div>
          </div>
          <input type="checkbox" ${isDarkMode ? 'checked' : ''} style="width:20px; height:20px; cursor:pointer;" onchange="toggleTheme(this.checked)" />
        </div>
        <div class="card" style="padding:12px; cursor:pointer;" onclick="resetDemoData()">
          <div style="font-weight:700; font-size:13px; color:var(--primary);">Reset to Sample Demo Data</div>
          <div style="font-size:11px; color:var(--text-muted);">Restores realistic warehouse, donor & relief records</div>
        </div>
        <div class="card" style="padding:12px;">
          <div style="font-weight:700; font-size:13px;">UN SDG Alignment</div>
          <div style="font-size:11px; color:var(--text-muted); line-height:1.4; margin-top:4px;">
            FoodBridge supports <strong>SDG 2 (Zero Hunger)</strong> and <strong>SDG 12.3 (Responsible Consumption)</strong> by cutting food waste and synchronizing distributions.
          </div>
        </div>
      `);
    }

    function toggleTheme(checked) {
      isDarkMode = checked;
      document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
      closeModal();
      showToast(`Switched to ${isDarkMode ? 'Dark' : 'Light'} theme.`);
    }

    function resetDemoData() {
      location.reload();
    }

    // Initialize
    renderScreen();
  </script>
</body>
</html>
